<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>관리자 · 나무위키 레이스</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="style.css?v=17" />
  <style>
    .adm-wrap { max-width: 880px; }
    .adm-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .adm-table th, .adm-table td { padding: 10px 8px; border-bottom: 1px solid var(--color-border-secondary); text-align: left; vertical-align: middle; }
    .adm-table th { color: var(--color-text-tertiary); font-weight: 500; font-size: 12px; white-space: nowrap; }
    .adm-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .adm-table .acts { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
    .adm-table .nick { font-weight: 600; }
    .adm-scroll { overflow-x: auto; padding: 0 16px 8px; }
    .adm-empty { padding: 24px; text-align: center; color: var(--color-text-tertiary); }
    .adm-search { margin: 12px 16px; }
    .btn-danger { color: var(--color-error); border-color: var(--color-error-border); }
    .btn-danger:hover:not(:disabled) { color: #fff; background: var(--color-error); border-color: var(--color-error); }
    .adm-msg { padding: 32px 16px; text-align: center; }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <div class="brand"><span class="brand-mark">⚙</span>관리자</div>
      <div class="header-right">
        <span id="hdr-user" class="hdr-user"></span>
        <a class="header-link" href="./">게임으로</a>
      </div>
    </div>
  </header>

  <main id="app" class="adm-wrap">
    <div id="adm-gate" class="card"><div class="adm-msg text-secondary">불러오는 중…</div></div>

    <div id="adm-main" class="hidden">
      <div class="card">
        <div class="card-head"><span class="card-title">승인 대기 (예전 가입)</span><span id="pending-count" class="text-tertiary"></span></div>
        <div class="adm-scroll">
          <table class="adm-table">
            <thead><tr><th>닉네임</th><th>아이디</th><th>이름</th><th>신청일</th><th></th></tr></thead>
            <tbody id="pending-list"></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><span class="card-title">회원</span><span id="member-count" class="text-tertiary"></span></div>
        <input id="member-search" class="input adm-search" placeholder="닉네임, 아이디, 이름으로 찾기" style="width:calc(100% - 32px)" />
        <div class="adm-scroll">
          <table class="adm-table">
            <thead><tr><th>닉네임</th><th>아이디</th><th>이름</th><th class="num">포인트</th><th class="num">게임</th><th class="num">🥇/🥈/🥉</th><th class="num">👑</th><th></th></tr></thead>
            <tbody id="member-list"></tbody>
          </table>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><span class="card-title">데이터 정리</span><button id="btn-cleanup" class="btn btn-sm btn-danger">지금 정리</button></div>
        <div class="card-body">
          <p id="cleanup-stats" class="text-secondary">불러오는 중…</p>
          <p id="nick-stats" class="text-secondary">닉네임 목록 확인 중…</p>
          <p class="text-tertiary small">2시간 넘게 활동이 없는 방은 시작 화면에 누가 들어올 때 자동으로 지워져요(30분에 한 번). 이 버튼은 지금 바로 정리해요.
            활동 기록이 없는 예전 방은 접속 중인 사람이 없을 때만 지워요.</p>
        </div>
      </div>
      <p class="text-tertiary small">관리자는 Firebase 콘솔의 Realtime Database에서 <code>admins/&lt;uid&gt; = true</code>로 지정해요.</p>
    </div>
  </main>
  <div id="toast" class="message" role="status"></div>
  <script type="module" src="admin.js?v=6"></script>
</body>
</html>
